version: '3'

tasks:
  build:
    desc: Build the asc compiler CLI binary
    cmds:
      - go build -o asc.exe ./cmd/asc

  codegen:
    desc: Regenerate checked-in test fixtures from .as schemas (requires build)
    deps: [build]
    cmds:
      - ./asc.exe --go_out=test/testgen_v1 test/schema_v1.as
      - ./asc.exe --go_out=test/testgen_v2 test/schema_v2.as
      - ./asc.exe --go_out=test/testgen_nested test/schema_nested.as
      - ./asc.exe --go_out=test/testgen_optional test/schema_optional.as
      - ./asc.exe --rust_out=test/test_rust/src test/schema_v2.as
      - ./asc.exe --py_out=test/test_py test/schema_v2.as
      - ./asc.exe --py_out=test/test_py test/schema_nested.as
      - ./asc.exe --ts_out=test/test_ts test/schema_v2.as

  test:unit:
    desc: Run unit tests for parser and guardian
    cmds:
      - go test -v ./compiler/parser ./compiler/guardian

  test:go:
    desc: Run Go E2E, golden cross-lang, limits, and benchmark tests
    cmds:
      - go test -v github.com/snowmerak/antiserial/test
  test:golden:
    desc: Run cross-language golden wire decode tests (Go, Python, Rust, Deno)
    cmds:
      - go test -v github.com/snowmerak/antiserial/test -run TestGolden

  test:rust:
    desc: Run Rust E2E verification test
    dir: test/test_rust
    cmds:
      - cargo run

  test:ts:
    desc: Run TypeScript E2E verification tests via Deno
    cmds:
      - deno run test/test_ts/test.ts
      - deno run test/test_ts/test_limits.ts

  test:py:
    desc: Run Python E2E verification tests
    cmds:
      - python test/test_py/test.py
      - python test/test_py/test_limits.py
      - python test/test_py/test_nested.py

  test:all:
    desc: Run all unit and E2E multi-language verification tests
    cmds:
      - task: build
      - task: test:unit
      - task: test:go
      - task: test:rust
      - task: test:ts
      - task: test:py

  bench:
    desc: Run comparative serialization benchmarks
    dir: test
    cmds:
      - go test -bench=Benchmark
